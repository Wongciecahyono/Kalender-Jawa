<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kalender Jawa - Weton & Pasaran</title>
    <style>
        /* ===== RESET & LAYOUT DASAR ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #f2e8d5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 950px;
            width: 100%;
            background: #fffbf2;
            border-radius: 24px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.1);
            padding: 24px 20px 32px;
            border: 1px solid #dcc9b0;
        }
        h1 {
            text-align: center;
            font-size: 28px;
            color: #4a3520;
            letter-spacing: 2px;
            margin-bottom: 4px;
            font-weight: 600;
        }
        .subtitle {
            text-align: center;
            color: #7a5d42;
            font-size: 14px;
            margin-bottom: 18px;
            border-bottom: 2px dashed #dcc9b0;
            padding-bottom: 12px;
        }

        /* ===== TAB ===== */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 18px;
        }
        .tabs button {
            background: #e5d5be;
            border: none;
            padding: 8px 28px;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 700;
            color: #4a3520;
            cursor: pointer;
            transition: 0.2s;
            border: 2px solid transparent;
        }
        .tabs button.active {
            background: #8b6b4c;
            color: white;
            border-color: #6b4f34;
        }
        .tabs button:hover {
            transform: scale(1.02);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }

        /* ===== NAVIGASI KALENDER ===== */
        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }
        .nav-group {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #e5d5be;
            padding: 4px 12px 4px 8px;
            border-radius: 40px;
        }
        .nav-group select {
            background: transparent;
            border: none;
            font-weight: 700;
            font-size: 18px;
            color: #3d2b1a;
            cursor: pointer;
            outline: none;
            padding: 4px 0;
            font-family: inherit;
            min-width: 80px;
        }
        .nav-group select option {
            background: #fffbf2;
            color: #3d2b1a;
            font-weight: 600;
        }
        .nav-group .month-select {
            min-width: 110px;
        }
        .nav button {
            background: #8b6b4c;
            border: none;
            color: white;
            font-size: 16px;
            padding: 4px 14px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
            border: 1px solid #6b4f34;
            line-height: 1.6;
            white-space: nowrap;
        }
        .nav button:hover {
            background: #6b4f34;
            transform: scale(1.03);
        }
        .nav button.today-btn {
            background: #b08968;
            font-size: 13px;
            padding: 4px 16px;
        }
        .nav button.today-btn:hover {
            background: #8b6b4c;
        }

        /* ===== GRID KALENDER ===== */
        .calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            margin-top: 10px;
        }
        .day-header {
            font-weight: 700;
            text-align: center;
            font-size: 14px;
            color: #4a3520;
            background: #e5d5be;
            padding: 8px 0;
            border-radius: 12px;
            letter-spacing: 1px;
        }
        .day-header.sunday-header {
            color: #d32f2f;
        }
        .day-header.friday-header {
            color: #2e7d32;
        }

        .cell {
            background: #fffdf7;
            border-radius: 14px;
            padding: 8px 4px;
            text-align: center;
            border: 1px solid #ede3d2;
            transition: 0.15s;
            min-height: 78px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .cell .date {
            font-size: 22px;
            font-weight: 700;
            color: #2b1d10;
            line-height: 1.2;
        }
        /* Warna Minggu & Jumat */
        .cell.sunday .date {
            color: #d32f2f;
        }
        .cell.friday .date {
            color: #2e7d32;
        }
        .cell.sunday {
            background: #fff0f0;
        }
        .cell.friday {
            background: #f0faf0;
        }

        .cell .pasaran {
            font-size: 12px;
            font-weight: 600;
            color: #7a5d42;
            background: #f4ebd0;
            padding: 1px 8px;
            border-radius: 30px;
            margin-top: 2px;
            display: inline-block;
            letter-spacing: 0.5px;
        }
        .cell .weton {
            font-size: 11px;
            color: #4a3520;
            font-weight: 500;
            margin-top: 1px;
        }
        /* LABEL HARI LIBUR */
        .cell .libur-label {
            font-size: 9px;
            font-weight: 700;
            color: #b35f2b;
            background: #fef0e6;
            padding: 1px 6px;
            border-radius: 12px;
            margin-top: 3px;
            display: inline-block;
            border: 1px solid #f0d5c0;
            max-width: 95%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .cell.today {
            background: #d4b08c !important;
            border-color: #8b6b4c;
            box-shadow: 0 0 0 2px #6b4f34;
        }
        .cell.today .date {
            color: #fff !important;
        }
        .cell.today .pasaran {
            background: #fffbf2;
            color: #4a3520;
        }
        .cell.today .weton {
            color: #fff;
        }
        .cell.today .libur-label {
            background: #fffbf2;
        }
        .cell.other-month {
            opacity: 0.35;
        }
        .cell.weekend {
            background: #fcf4e8;
        }
        .cell.sunday.weekend {
            background: #fff0f0 !important;
        }
        .cell.friday.weekend {
            background: #f0faf0 !important;
        }

        /* ===== EKSPOR ===== */
        .export-area {
            margin-top: 24px;
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .export-area button {
            background: #2d5a3a;
            border: none;
            color: white;
            font-size: 16px;
            font-weight: 600;
            padding: 12px 32px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid #1d402a;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .export-area button:hover {
            background: #1d402a;
            transform: scale(1.02);
        }

        /* ===== FOOTER ===== */
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #a0846a;
            border-top: 1px solid #ede3d2;
            padding-top: 16px;
        }
        .footer strong {
            color: #4a3520;
        }

        /* ===== KALKULATOR ===== */
        .calculator {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            background: #fcf6ed;
            border-radius: 20px;
            border: 1px solid #ede3d2;
        }
        .calculator .form-group {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        .calculator .form-group label {
            font-weight: 700;
            color: #4a3520;
            font-size: 16px;
        }
        .calculator .form-group input[type="date"] {
            padding: 8px 14px;
            border: 2px solid #dcc9b0;
            border-radius: 30px;
            font-size: 16px;
            background: white;
            flex: 1;
            min-width: 150px;
        }
        .calculator .form-group button {
            background: #8b6b4c;
            border: none;
            color: white;
            font-weight: 700;
            font-size: 16px;
            padding: 8px 24px;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid #6b4f34;
        }
        .calculator .form-group button:hover {
            background: #6b4f34;
        }
        .result-box {
            background: white;
            border-radius: 16px;
            padding: 16px 20px;
            margin-top: 12px;
            border: 1px solid #dcc9b0;
        }
        .result-box .row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px dashed #ede3d2;
        }
        .result-box .row:last-child {
            border-bottom: none;
        }
        .result-box .label {
            font-weight: 600;
            color: #4a3520;
        }
        .result-box .value {
            font-weight: 700;
            color: #2b1d10;
        }
        .arti-box {
            margin-top: 12px;
            background: #f4ebd0;
            border-radius: 16px;
            padding: 16px 20px;
            text-align: center;
            border: 2px solid #b08968;
        }
        .arti-box .title {
            font-size: 20px;
            font-weight: 800;
            color: #3d2b1a;
        }
        .arti-box .desc {
            font-size: 16px;
            color: #4a3520;
            margin-top: 4px;
        }
        .arti-box .note {
            font-size: 14px;
            color: #7a5d42;
            margin-top: 8px;
            font-style: italic;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 500px) {
            .container {
                padding: 12px 8px;
            }
            .cell {
                min-height: 60px;
                padding: 4px 2px;
            }
            .cell .date {
                font-size: 17px;
            }
            .cell .pasaran {
                font-size: 9px;
                padding: 0 5px;
            }
            .cell .libur-label {
                font-size: 7px;
                padding: 0 4px;
            }
            .nav {
                gap: 6px;
            }
            .nav-group {
                padding: 2px 8px;
            }
            .nav-group select {
                font-size: 15px;
                min-width: 60px;
            }
            .nav-group .month-select {
                min-width: 80px;
            }
            .nav button {
                font-size: 13px;
                padding: 2px 10px;
            }
            .export-area button {
                font-size: 14px;
                padding: 10px 20px;
            }
            .tabs button {
                font-size: 14px;
                padding: 6px 16px;
            }
            .calculator .form-group {
                flex-direction: column;
                align-items: stretch;
            }
            .calculator .form-group input[type="date"] {
                width: 100%;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📅 Kalender Jawa</h1>
    <div class="subtitle">Weton • Pasaran • Masehi • <span style="color:#b35f2b;">1 Jan 2000 = Sabtu Legi</span></div>

    <!-- TAB -->
    <div class="tabs">
        <button class="tab-btn active" data-tab="calendar">📅 Kalender</button>
        <button class="tab-btn" data-tab="calculator">🧮 Kalkulator</button>
    </div>

    <!-- KONTEN TAB KALENDER -->
    <div id="tab-calendar" class="tab-content active">
        <div class="nav">
            <div class="nav-group">
                <button id="yearPrevBtn">◀◀</button>
                <select id="yearSelect" class="year-select"></select>
                <button id="yearNextBtn">▶▶</button>
            </div>
            <div class="nav-group">
                <button id="monthPrevBtn">◀</button>
                <select id="monthSelect" class="month-select"></select>
                <button id="monthNextBtn">▶</button>
            </div>
            <button class="today-btn" id="todayBtn">● Hari Ini</button>
        </div>
        <div class="calendar" id="calendarGrid"></div>
        <div class="export-area">
            <button id="exportYearIcs">📤 Ekspor ICS Tahun <span id="exportYearLabel">2026</span></button>
        </div>
    </div>

    <!-- KONTEN TAB KALKULATOR -->
    <div id="tab-calculator" class="tab-content">
        <div class="calculator">
            <div class="form-group">
                <label for="birthDate">📆 Pilih Tanggal:</label>
                <input type="date" id="birthDate" value="2026-08-23" />
                <button id="calcBtn">Hitung</button>
            </div>
            <div id="resultArea">
                <!-- Hasil akan ditampilkan di sini -->
            </div>
        </div>
    </div>

    <div class="footer">
        ⚡ Satu file <strong>.ICS</strong> untuk satu tahun penuh (365 hari) • 
        Cocok untuk Google Calendar / iCal
    </div>
</div>

<script>
    // ============================================================
    //  1. DATA HARI LIBUR NASIONAL & CUTI BERSAMA 2026
    // ============================================================
    const LIBUR_NASIONAL = {
        '2026-01-01': 'Tahun Baru 2026',
        '2026-01-16': 'Isra Mikraj Nabi Muhammad SAW',
        '2026-02-17': 'Tahun Baru Imlek 2577',
        '2026-03-19': 'Hari Suci Nyepi (Saka 1948)',
        '2026-03-21': 'Idul Fitri 1447 H',
        '2026-03-22': 'Idul Fitri 1447 H',
        '2026-04-03': 'Wafat Yesus Kristus',
        '2026-04-05': 'Paskah',
        '2026-05-01': 'Hari Buruh Internasional',
        '2026-05-14': 'Kenaikan Yesus Kristus',
        '2026-05-27': 'Idul Adha 1447 H',
        '2026-05-31': 'Hari Raya Waisak 2570 BE',
        '2026-06-01': 'Hari Lahir Pancasila',
        '2026-06-16': 'Tahun Baru Islam 1448 H',
        '2026-08-17': 'Hari Kemerdekaan RI',
        '2026-08-25': 'Maulid Nabi Muhammad SAW',
        '2026-12-25': 'Hari Raya Natal',
    };

    const CUTI_BERSAMA = {
        '2026-02-16': 'Cuti Bersama Imlek',
        '2026-03-18': 'Cuti Bersama Nyepi',
        '2026-03-20': 'Cuti Bersama Idul Fitri',
        '2026-03-23': 'Cuti Bersama Idul Fitri',
        '2026-03-24': 'Cuti Bersama Idul Fitri',
        '2026-05-15': 'Cuti Bersama Kenaikan Yesus Kristus',
        '2026-05-28': 'Cuti Bersama Idul Adha',
        '2026-12-24': 'Cuti Bersama Natal',
    };

    // ============================================================
    //  2. PATOKAN & KONSTANTA
    // ============================================================
    const PASARAN = ['Legi', 'Pahing', 'Pon', 'Wage', 'Kliwon'];
    const NAMA_HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
    const NAMA_BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
        'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'
    ];
    const NAMA_BULAN_PENDEX = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
    const BASE_DATE = new Date(Date.UTC(2000, 0, 1));

    // NEPTU
    const NEPTU_HARI = { 'Minggu': 5, 'Senin': 4, 'Selasa': 3, 'Rabu': 7, 'Kamis': 8, 'Jumat': 6, 'Sabtu': 9 };
    const NEPTU_PASARAN = { 'Legi': 5, 'Pahing': 9, 'Pon': 7, 'Wage': 4, 'Kliwon': 8 };
    const ARTI_WETON = [
        { sisa: 0, nama: 'Pegat', desc: 'Tidak baik, hindari!', note: 'Kekurangan, sering konflik' },
        { sisa: 1, nama: 'Ratu', desc: 'Harmonis, baik!', note: 'Kehidupan rukun dan bahagia' },
        { sisa: 2, nama: 'Jodho', desc: 'Cocok, baik!', note: 'Saling mencocoki' },
        { sisa: 3, nama: 'Topo', desc: 'Kurang harmonis', note: 'Banyak ujian' },
        { sisa: 4, nama: 'Tinari', desc: 'Bahagia, baik!', note: 'Kehidupan tenteram' },
        { sisa: 5, nama: 'Padu', desc: 'Sering bertengkar', note: 'Konflik sering terjadi' },
        { sisa: 6, nama: 'Sujanan', desc: 'Konflik, kurang baik', note: 'Cemburu dan perselisihan' }
    ];

    // ============================================================
    //  3. FUNGSI DASAR
    // ============================================================
    function getJawaInfo(year, month, day) {
        const target = new Date(Date.UTC(year, month, day));
        const diffMs = target.getTime() - BASE_DATE.getTime();
        const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
        const pasaranIdx = ((diffDays % 5) + 5) % 5;
        const hariIdx = target.getUTCDay();
        const hari = NAMA_HARI[hariIdx];
        const pasaran = PASARAN[pasaranIdx];
        return {
            hari,
            pasaran,
            weton: hari + ' ' + pasaran,
            neptuHari: NEPTU_HARI[hari],
            neptuPasaran: NEPTU_PASARAN[pasaran],
            totalNeptu: NEPTU_HARI[hari] + NEPTU_PASARAN[pasaran]
        };
    }

    // ============================================================
    //  4. RENDER KALENDER (dengan label hari libur)
    // ============================================================
    function renderCalendar(year, month) {
        const grid = document.getElementById('calendarGrid');
        document.getElementById('exportYearLabel').textContent = year;

        document.getElementById('yearSelect').value = year;
        document.getElementById('monthSelect').value = month;

        const firstDay = new Date(Date.UTC(year, month, 1)).getUTCDay();
        const daysInMonth = new Date(Date.UTC(year, month + 1, 0)).getUTCDate();
        const daysInPrevMonth = new Date(Date.UTC(year, month, 0)).getUTCDate();

        let startOffset = (firstDay === 0) ? 6 : firstDay - 1;

        let html = '';
        const headerHari = ['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'];
        headerHari.forEach((h, idx) => {
            let cls = 'day-header';
            if (idx === 4) cls += ' friday-header';
            if (idx === 6) cls += ' sunday-header';
            html += `<div class="${cls}">${h}</div>`;
        });

        const today = new Date();
        const todayUTC = new Date(Date.UTC(today.getFullYear(), today.getMonth(), today.getDate()));

        // Sel kosong awal
        for (let i = 0; i < startOffset; i++) {
            const prevDate = daysInPrevMonth - startOffset + i + 1;
            html += `<div class="cell other-month"><div class="date">${prevDate}</div></div>`;
        }

        // Loop tanggal
        for (let d = 1; d <= daysInMonth; d++) {
            const info = getJawaInfo(year, month, d);
            const currentDate = new Date(Date.UTC(year, month, d));
            const isToday = currentDate.getTime() === todayUTC.getTime();
            const dayIdx = currentDate.getUTCDay();

            // Buat key tanggal YYYY-MM-DD
            const dateKey = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            let liburLabel = '';
            if (LIBUR_NASIONAL[dateKey]) {
                liburLabel = '🏛️ ' + LIBUR_NASIONAL[dateKey];
            } else if (CUTI_BERSAMA[dateKey]) {
                liburLabel = '📅 ' + CUTI_BERSAMA[dateKey];
            }

            let classes = 'cell';
            if (isToday) classes += ' today';
            if (dayIdx === 5 || dayIdx === 6) classes += ' weekend';
            if (dayIdx === 0) classes += ' sunday';
            if (dayIdx === 5) classes += ' friday';

            html += `
                <div class="${classes}">
                    <div class="date">${d}</div>
                    <span class="pasaran">${info.pasaran}</span>
                    <div class="weton">${info.hari}</div>
                    ${liburLabel ? `<div class="libur-label">${liburLabel}</div>` : ''}
                </div>
            `;
        }

        // Sel kosong akhir
        const totalCells = startOffset + daysInMonth;
        const remaining = (7 - (totalCells % 7)) % 7;
        for (let i = 1; i <= remaining; i++) {
            html += `<div class="cell other-month"><div class="date">${i}</div></div>`;
        }

        grid.innerHTML = html;
    }

    // ============================================================
    //  5. GENERATE ICS (dengan label libur di deskripsi)
    // ============================================================
    function generateYearICS(year) {
        let ics = [];
        ics.push('BEGIN:VCALENDAR');
        ics.push('VERSION:2.0');
        ics.push('PRODID:-//Kalender Jawa//v1.0//ID');
        ics.push('CALSCALE:GREGORIAN');
        ics.push('X-WR-CALNAME;VALUE=TEXT:Kalender Jawa ' + year);
        ics.push('X-WR-CALDESC;VALUE=TEXT:Weton dan Pasaran untuk tahun ' + year);

        for (let m = 0; m < 12; m++) {
            const daysInMonth = new Date(Date.UTC(year, m + 1, 0)).getUTCDate();
            for (let d = 1; d <= daysInMonth; d++) {
                const info = getJawaInfo(year, m, d);
                const dateKey = `${year}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                let liburText = '';
                if (LIBUR_NASIONAL[dateKey]) {
                    liburText = ' [LIBUR: ' + LIBUR_NASIONAL[dateKey] + ']';
                } else if (CUTI_BERSAMA[dateKey]) {
                    liburText = ' [CUTI: ' + CUTI_BERSAMA[dateKey] + ']';
                }

                const y = year;
                const mo = String(m + 1).padStart(2, '0');
                const day = String(d).padStart(2, '0');
                const dateStr = `${y}${mo}${day}`;

                ics.push('BEGIN:VEVENT');
                ics.push(`DTSTART;VALUE=DATE:${dateStr}`);
                ics.push(`DTEND;VALUE=DATE:${dateStr}`);
                ics.push(`SUMMARY:${info.weton}${liburText}`);
                ics.push(`DESCRIPTION:Tanggal ${d} ${NAMA_BULAN_PENDEX[m]} ${year} - ${info.weton}${liburText}`);
                ics.push('END:VEVENT');
            }
        }

        ics.push('END:VCALENDAR');
        return ics.join('\r\n');
    }

    function downloadYearICS(year) {
        const content = generateYearICS(year);
        const blob = new Blob([content], { type: 'text/calendar;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `kalender-jawa-${year}.ics`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    // ============================================================
    //  6. KALKULATOR
    // ============================================================
    function hitungWeton(tanggal) {
        const parts = tanggal.split('-');
        const year = parseInt(parts[0]);
        const month = parseInt(parts[1]) - 1;
        const day = parseInt(parts[2]);
        const info = getJawaInfo(year, month, day);
        const sisa = info.totalNeptu % 7;
        const arti = ARTI_WETON.find(a => a.sisa === sisa);
        return { ...info, sisa, arti };
    }

    function tampilkanHasil(tanggal) {
        const data = hitungWeton(tanggal);
        const area = document.getElementById('resultArea');
        area.innerHTML = `
            <div class="result-box">
                <div class="row"><span class="label">Hari</span><span class="value">${data.hari}</span></div>
                <div class="row"><span class="label">Pasaran</span><span class="value">${data.pasaran}</span></div>
                <div class="row"><span class="label">Neptu Hari</span><span class="value">${data.neptuHari}</span></div>
                <div class="row"><span class="label">Neptu Pasaran</span><span class="value">${data.neptuPasaran}</span></div>
                <div class="row"><span class="label">Total Neptu</span><span class="value" style="font-size:20px;">${data.totalNeptu}</span></div>
                <div class="row"><span class="label">Weton</span><span class="value" style="font-size:18px;">${data.weton}</span></div>
            </div>
            <div class="arti-box">
                <div class="title">${data.arti.nama}</div>
                <div class="desc">${data.arti.desc}</div>
                <div class="note">${data.arti.note}</div>
            </div>
        `;
    }

    // ============================================================
    //  7. POPULATE DROPDOWN
    // ============================================================
    function populateDropdowns() {
        const yearSelect = document.getElementById('yearSelect');
        const monthSelect = document.getElementById('monthSelect');

        const now = new Date().getFullYear();
        const startYear = now - 30;
        const endYear = now + 20;

        yearSelect.innerHTML = '';
        for (let y = startYear; y <= endYear; y++) {
            const opt = document.createElement('option');
            opt.value = y;
            opt.textContent = y;
            yearSelect.appendChild(opt);
        }

        monthSelect.innerHTML = '';
        NAMA_BULAN.forEach((nama, idx) => {
            const opt = document.createElement('option');
            opt.value = idx;
            opt.textContent = nama;
            monthSelect.appendChild(opt);
        });
    }

    // ============================================================
    //  8. STATE & NAVIGASI
    // ============================================================
    let currentYear = 2026;
    let currentMonth = 7;

    function updateCalendar() {
        renderCalendar(currentYear, currentMonth);
    }

    document.getElementById('yearSelect').addEventListener('change', function(e) {
        currentYear = parseInt(e.target.value);
        updateCalendar();
    });
    document.getElementById('monthSelect').addEventListener('change', function(e) {
        currentMonth = parseInt(e.target.value);
        updateCalendar();
    });

    document.getElementById('yearPrevBtn').addEventListener('click', () => {
        currentYear--;
        updateCalendar();
    });
    document.getElementById('yearNextBtn').addEventListener('click', () => {
        currentYear++;
        updateCalendar();
    });
    document.getElementById('monthPrevBtn').addEventListener('click', () => {
        currentMonth--;
        if (currentMonth < 0) {
            currentMonth = 11;
            currentYear--;
        }
        updateCalendar();
    });
    document.getElementById('monthNextBtn').addEventListener('click', () => {
        currentMonth++;
        if (currentMonth > 11) {
            currentMonth = 0;
            currentYear++;
        }
        updateCalendar();
    });
    document.getElementById('todayBtn').addEventListener('click', () => {
        const today = new Date();
        currentYear = today.getFullYear();
        currentMonth = today.getMonth();
        updateCalendar();
    });

    document.getElementById('exportYearIcs').addEventListener('click', () => {
        downloadYearICS(currentYear);
    });

    // ============================================================
    //  9. KALKULATOR EVENT
    // ============================================================
    document.getElementById('calcBtn').addEventListener('click', function() {
        const dateInput = document.getElementById('birthDate').value;
        if (!dateInput) {
            alert('Silakan pilih tanggal terlebih dahulu.');
            return;
        }
        tampilkanHasil(dateInput);
    });

    window.addEventListener('load', function() {
        const defaultDate = document.getElementById('birthDate').value;
        if (defaultDate) {
            tampilkanHasil(defaultDate);
        }
    });

    // ============================================================
    //  10. TAB
    // ============================================================
    const tabBtns = document.querySelectorAll('.tab-btn');
    const tabContents = document.querySelectorAll('.tab-content');

    tabBtns.forEach(btn => {
        btn.addEventListener('click', function() {
            const target = this.dataset.tab;
            tabBtns.forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            tabContents.forEach(c => c.classList.remove('active'));
            document.getElementById('tab-' + target).classList.add('active');
        });
    });

    // ============================================================
    //  11. INISIALISASI
    // ============================================================
    populateDropdowns();
    document.getElementById('yearSelect').value = 2026;
    document.getElementById('monthSelect').value = 7;
    renderCalendar(2026, 7);

    console.log('✅ Kalender Jawa dengan Hari Libur Nasional & Cuti Bersama 2026');
    console.log('✅ 17 Agustus 2026:', getJawaInfo(2026, 7, 17).weton, '🏛️ Hari Kemerdekaan RI');
</script>
</body>
</html>
