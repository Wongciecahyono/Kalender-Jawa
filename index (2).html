<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kalender Jawa – Akurat + .ics</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Segoe UI',Tahoma,sans-serif; background:#f0ebe4; padding:20px; display:flex; justify-content:center; }
        .container { max-width:1100px; width:100%; background:#fffcf8; border-radius:32px; padding:30px 25px; border:1px solid #e4d8cd; }
        h1 { font-size:28px; color:#3d2c1e; display:flex; align-items:center; gap:12px; margin-bottom:20px; flex-wrap:wrap; }
        .nav { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; background:#f5efe8; border-radius:60px; padding:8px 20px; margin-bottom:20px; gap:10px; }
        .nav .label { font-size:22px; font-weight:700; color:#3d2c1e; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
        .nav .label .jawa { color:#8b5a3c; font-weight:600; }
        .nav .label .sub { font-size:16px; font-weight:400; color:#7a6553; }
        .nav .label .bulan-jawa { font-size:18px; font-weight:600; color:#5a3e2b; background:#e4d8cd; padding:2px 16px; border-radius:40px; }
        .nav-buttons { display:flex; gap:5px; align-items:center; flex-wrap:wrap; }
        .nav-selector { display:flex; gap:5px; align-items:center; }
        .nav-selector select { padding:6px 10px; border-radius:40px; border:1px solid #dccfc2; background:#fff; font-weight:600; font-size:14px; color:#3d2c1e; outline:none; cursor:pointer; }
        .nav-selector select:hover { background:#f5efe8; }
        .btn { padding:8px 18px; border:none; border-radius:40px; background:#fff; color:#3d2c1e; font-weight:600; cursor:pointer; transition:0.2s; border:1px solid #dccfc2; font-size:14px; }
        .btn:hover { background:#e4d8cd; transform:translateY(-2px); }
        .btn-today { background:#5a3e2b; color:#fff; border-color:#5a3e2b; }
        .btn-today:hover { background:#4a3222; }
        .btn-ics { background:#1a5c8a; color:#fff; border-color:#1a5c8a; }
        .btn-ics:hover { background:#124a6f; }
        .btn-outline { background:transparent; border-color:#dccfc2; }
        .grid { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin:20px 0; }
        .grid .day-name { text-align:center; font-weight:700; font-size:14px; color:#5a4a3a; padding:10px 0 6px; border-bottom:2px solid #e4d8cd; }
        .grid .day-name.sunday { color:#b13e3e; }
        .grid .day-name.friday { color:#2d7d46; }
        .grid .cell { border-radius:16px; padding:6px 4px 4px; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; border:1px solid #e4d8cd; min-height:85px; background:#fff; transition:0.1s; }
        .grid .cell.other-month { opacity:0.3; }
        .grid .cell.today { border-color:#5a3e2b; box-shadow:inset 0 0 0 2px #5a3e2b; }
        .grid .cell.neton-baik { background:#d4edda; }
        .grid .cell.neton-sedang { background:#fff3cd; }
        .grid .cell.neton-jelek { background:#f8d7da; }
        .grid .cell .date-num { font-size:22px; font-weight:700; color:#3d2c1e; line-height:1.2; }
        .grid .cell.sunday .date-num { color:#b13e3e; }
        .grid .cell.friday .date-num { color:#2d7d46; }
        .grid .cell .jawa-date { font-size:11px; color:#7a6553; font-weight:500; line-height:1.2; text-align:center; }
        .grid .cell .pasaran { font-size:11px; font-weight:700; color:#8b5a3c; background:rgba(255,255,255,0.7); padding:1px 10px; border-radius:20px; margin-top:2px; }
        .grid .cell .wuku { font-size:9px; color:#5a4a3a; background:rgba(255,255,255,0.7); padding:1px 8px; border-radius:12px; margin-top:2px; }
        .grid .cell .neptu { font-size:10px; font-weight:700; margin-top:2px; }
        .grid .cell .neptu.neptu-merah { color:#b13e3e; }
        .grid .cell .neptu.neptu-biru { color:#1a5c8a; }
        .info-panel { display:flex; flex-wrap:wrap; gap:15px; margin-top:20px; padding:15px 20px; background:#f5efe8; border-radius:24px; border:1px solid #e4d8cd; }
        .info-panel .item { flex:1 1 150px; }
        .info-panel .item .label { font-size:12px; text-transform:uppercase; color:#7a6553; font-weight:600; }
        .info-panel .item .value { font-size:20px; font-weight:700; color:#3d2c1e; }
        .legend { display:flex; flex-wrap:wrap; gap:20px; margin:10px 0 0; padding:10px 16px; background:#f5efe8; border-radius:40px; border:1px solid #e4d8cd; }
        .legend .leg-item { display:flex; align-items:center; gap:8px; font-size:13px; color:#3d2c1e; }
        .legend .color-box { width:20px; height:20px; border-radius:6px; border:1px solid #ccc; }
        .color-box.baik { background:#d4edda; }
        .color-box.sedang { background:#fff3cd; }
        .color-box.jelek { background:#f8d7da; }
        .ics-section { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; margin-top:20px; padding:16px 20px; background:#f5efe8; border-radius:24px; border:1px solid #e4d8cd; gap:15px; }
        .ics-section .left { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
        .ics-section .right { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
        .range-selector { display:flex; align-items:center; gap:8px; background:#fff; padding:4px 12px 4px 16px; border-radius:40px; border:1px solid #dccfc2; }
        .range-selector select { border:none; background:transparent; font-weight:600; font-size:14px; color:#3d2c1e; padding:6px 0; outline:none; cursor:pointer; }
        .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:#2d1f14; color:#f5efe8; padding:14px 28px; border-radius:60px; font-weight:500; font-size:15px; box-shadow:0 12px 40px rgba(0,0,0,0.35); opacity:0; transition:opacity 0.4s; pointer-events:none; z-index:999; max-width:90vw; text-align:center; }
        .toast.show { opacity:1; }
        .toast.success { background:#2d7d46; }
        .toast.info { background:#1a5c8a; }
        @media (max-width:700px) {
            .container { padding:15px 10px; }
            .nav { flex-direction:column; align-items:stretch; padding:12px 16px; }
            .nav .label { font-size:18px; justify-content:center; }
            .grid .cell { min-height:60px; padding:4px 2px; }
            .grid .cell .date-num { font-size:16px; }
            .grid .cell .jawa-date { font-size:9px; }
            .grid .cell .pasaran { font-size:9px; padding:0 6px; }
            .grid .cell .wuku { font-size:7px; padding:0 4px; }
            .grid .cell .neptu { font-size:8px; }
            .info-panel .item .value { font-size:17px; }
            .legend { justify-content:center; }
            .ics-section { flex-direction:column; align-items:stretch; }
            .ics-section .right { justify-content:center; }
            .nav-selector { flex-wrap:wrap; justify-content:center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌾 Kalender Jawa <span style="font-size:16px;font-weight:400;color:#7a6553;">Akurat • Weton & Neton</span></h1>

        <div class="nav">
            <div class="label">
                <div>
                    <span id="monthLabel">Januari 2025</span>
                    <span class="jawa" id="jawaMonthLabel">Sura 1957</span>
                    <span class="sub" id="gregLabel">(Gregorian)</span>
                </div>
                <div>
                    <span class="bulan-jawa" id="bulanJawaHeader">Besar 1958 AJ</span>
                </div>
            </div>
            <div class="nav-buttons">
                <!-- Dropdown navigasi -->
                <div class="nav-selector">
                    <select id="monthSelect">
                        <option value="0">Januari</option>
                        <option value="1">Februari</option>
                        <option value="2">Maret</option>
                        <option value="3">April</option>
                        <option value="4">Mei</option>
                        <option value="5">Juni</option>
                        <option value="6">Juli</option>
                        <option value="7">Agustus</option>
                        <option value="8">September</option>
                        <option value="9">Oktober</option>
                        <option value="10">November</option>
                        <option value="11">Desember</option>
                    </select>
                    <select id="yearSelect"></select>
                </div>
                <button class="btn btn-today" id="btnToday">Hari ini</button>
                <button class="btn" id="prevMonth">‹</button>
                <button class="btn" id="nextMonth">›</button>
            </div>
        </div>

        <div class="grid" id="calendarGrid"></div>

        <div class="legend">
            <span class="leg-item"><span class="color-box baik"></span> Baik (Neton 2,6)</span>
            <span class="leg-item"><span class="color-box sedang"></span> Sedang (Neton 3,5)</span>
            <span class="leg-item"><span class="color-box jelek"></span> Jelek (Neton 1,4,7)</span>
            <span class="leg-item">🟡 Hari ini</span>
            <span class="leg-item">🔴 Minggu</span>
            <span class="leg-item">🟢 Jumat</span>
        </div>

        <div class="info-panel">
            <div class="item"><div class="label">Tanggal Jawa</div><div class="value" id="infoJawaDate">-</div></div>
            <div class="item"><div class="label">Pasaran & Neptu</div><div class="value" id="infoWeton">-</div></div>
            <div class="item"><div class="label">Wuku</div><div class="value" id="infoWuku">-</div></div>
            <div class="item"><div class="label">Tahun Jawa</div><div class="value" id="infoTahunJawa">-</div></div>
        </div>

        <div class="ics-section">
            <div class="left">
                <span style="font-weight:600;color:#3d2c1e;">📅 Ekspor .ics</span>
                <span id="icsStatus" style="color:#5a4a3a;">Pilih rentang</span>
            </div>
            <div class="right">
                <div class="range-selector">
                    <span style="font-size:13px;color:#7a6553;">Rentang</span>
                    <select id="rangeSelect">
                        <option value="1">Bulan ini</option>
                        <option value="3">3 bulan</option>
                        <option value="6">6 bulan</option>
                        <option value="12">1 tahun</option>
                    </select>
                </div>
                <button class="btn btn-ics" id="btnDownloadICS">⬇️ Unduh .ics</button>
                <button class="btn btn-outline" id="btnCopyICS">📋 Salin link</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        (function() {
            'use strict';

            // ================== DATA ==================
            const NILAI_HARI = [5,4,3,7,8,6,9];
            const NILAI_PASARAN = { 'Legi':5, 'Pahing':9, 'Pon':7, 'Wage':4, 'Kliwon':8 };
            const PASARAN_URUT = ['Legi','Pahing','Pon','Wage','Kliwon'];
            const WUKU = [
                'Sinta','Landhep','Wukir','Kurantil','Tolu',
                'Gumbreg','Warigalit','Warijathil','Waga','Bala',
                'Naga','Kala','Dukut','Watugunung','Sungsang',
                'Galungan','Kuningan','Langkir','Mandhasiya','Julungpujut',
                'Pahang','Kuruwelut','Marakeh','Tambir','Medangkungan',
                'Maktal','Wuyung','Manail','Prangbakat','Bala'
            ];
            const ARTI_NETON = ['','Mati','Kekayaan','Selamat','Cerai','Prihatin','Lancar','Pegat'];
            const NAMA_HARI = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
            const BULAN_MASEHI = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
            const BULAN_JAWA = ['Sura','Sapar','Mulud','Bakda Mulud','Jumadil Awal','Jumadil Akhir','Rejeb','Ruwah','Pasa','Sawal','Sela','Besar'];

            // Acuan: 1 Agustus 2026 = Sabtu Kliwon
            const REF_DATE = new Date(2026, 7, 1);
            const REF_DAY = 6;
            const REF_PASARAN_INDEX = 4; // Kliwon
            const REF_WUKU_INDEX = 0;

            function getDayDiff(year, month, day) {
                const target = new Date(year, month, day);
                return Math.round((target - REF_DATE) / 86400000);
            }

            function getJawa(year, month, day) {
                const diff = getDayDiff(year, month, day);
                const dayOfWeek = ((REF_DAY + diff) % 7 + 7) % 7;
                const pasaranIdx = ((REF_PASARAN_INDEX + diff) % 5 + 5) % 5;
                const pasaran = PASARAN_URUT[pasaranIdx];
                const wukuIdx = ((REF_WUKU_INDEX + diff) % 30 + 30) % 30;
                const wuku = WUKU[wukuIdx];
                const nilaiHari = NILAI_HARI[dayOfWeek];
                const nilaiPasaran = NILAI_PASARAN[pasaran];
                const neptu = nilaiHari + nilaiPasaran;
                const neton = (neptu % 7 === 0) ? 7 : neptu % 7;

                let jDay = 17 + diff;
                let jMonth = 11;
                let jYear = 1958;
                while (jDay > 30) { jDay -= 30; jMonth++; if (jMonth >= 12) { jMonth = 0; jYear++; } }
                while (jDay < 1) { jDay += 30; jMonth--; if (jMonth < 0) { jMonth = 11; jYear--; } }

                return {
                    dayOfWeek,
                    namaHari: NAMA_HARI[dayOfWeek],
                    pasaran,
                    wuku,
                    neptu,
                    neton,
                    jawaDay: jDay,
                    jawaMonth: jMonth,
                    jawaYear: jYear,
                    bulanJawa: BULAN_JAWA[jMonth] || 'Sura',
                    artiNeton: ARTI_NETON[neton]
                };
            }

            function getNetonClass(neton) {
                if (neton === 2 || neton === 6) return 'neton-baik';
                if (neton === 3 || neton === 5) return 'neton-sedang';
                return 'neton-jelek';
            }

            function getNeptuColorClass(neton) {
                if (neton === 1 || neton === 4 || neton === 7) return 'neptu-merah';
                return 'neptu-biru';
            }

            // ================== RENDER ==================
            let today = new Date();
            let currentYear = today.getFullYear();
            let currentMonth = today.getMonth();

            const grid = document.getElementById('calendarGrid');
            const monthLabel = document.getElementById('monthLabel');
            const jawaMonthLabel = document.getElementById('jawaMonthLabel');
            const gregLabel = document.getElementById('gregLabel');
            const bulanJawaHeader = document.getElementById('bulanJawaHeader');
            const infoJawaDate = document.getElementById('infoJawaDate');
            const infoWeton = document.getElementById('infoWeton');
            const infoWuku = document.getElementById('infoWuku');
            const infoTahunJawa = document.getElementById('infoTahunJawa');
            const icsStatus = document.getElementById('icsStatus');

            const btnToday = document.getElementById('btnToday');
            const prevMonthBtn = document.getElementById('prevMonth');
            const nextMonthBtn = document.getElementById('nextMonth');
            const btnDownloadICS = document.getElementById('btnDownloadICS');
            const btnCopyICS = document.getElementById('btnCopyICS');
            const rangeSelect = document.getElementById('rangeSelect');
            const monthSelect = document.getElementById('monthSelect');
            const yearSelect = document.getElementById('yearSelect');
            const toast = document.getElementById('toast');

            // ================== POPULATE YEAR DROPDOWN ==================
            function populateYearDropdown() {
                const currentYear = today.getFullYear();
                const startYear = currentYear - 30;
                const endYear = currentYear + 20;
                yearSelect.innerHTML = '';
                for (let y = startYear; y <= endYear; y++) {
                    const opt = document.createElement('option');
                    opt.value = y;
                    opt.textContent = y;
                    yearSelect.appendChild(opt);
                }
                yearSelect.value = currentYear;
            }
            populateYearDropdown();

            // ================== RENDER KALENDER ==================
            function renderCalendar(year, month) {
                // Sinkronkan dropdown dengan tahun/bulan yang sedang ditampilkan
                monthSelect.value = month;
                yearSelect.value = year;

                const firstDay = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const daysInPrev = new Date(year, month, 0).getDate();

                monthLabel.textContent = `${BULAN_MASEHI[month]} ${year}`;
                const firstJawa = getJawa(year, month, 1);
                jawaMonthLabel.textContent = `${firstJawa.bulanJawa} ${firstJawa.jawaYear}`;
                gregLabel.textContent = '(Gregorian)';
                bulanJawaHeader.textContent = `${firstJawa.bulanJawa} ${firstJawa.jawaYear} AJ`;

                let html = '';
                const dayNames = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
                for (let i = 0; i < 7; i++) {
                    let cls = 'day-name';
                    if (i === 0) cls += ' sunday';
                    if (i === 5) cls += ' friday';
                    html += `<div class="${cls}">${dayNames[i]}</div>`;
                }

                // Previous month
                for (let i = 0; i < firstDay; i++) {
                    const d = daysInPrev - firstDay + i + 1;
                    const m = month === 0 ? 11 : month - 1;
                    const y = month === 0 ? year - 1 : year;
                    const j = getJawa(y, m, d);
                    const cls = getNetonClass(j.neton);
                    const dayCls = (j.dayOfWeek === 0) ? ' sunday' : (j.dayOfWeek === 5 ? ' friday' : '');
                    html += `<div class="cell other-month ${cls}${dayCls}">
                                <div class="date-num">${d}</div>
                                <div class="jawa-date">${j.jawaDay}</div>
                                <div class="pasaran">${j.pasaran}</div>
                                <div class="neptu ${getNeptuColorClass(j.neton)}">${j.neptu}</div>
                            </div>`;
                }

                // Current month
                for (let d = 1; d <= daysInMonth; d++) {
                    const j = getJawa(year, month, d);
                    const todayClass = isToday(year, month, d) ? ' today' : '';
                    const cls = getNetonClass(j.neton);
                    const dayCls = (j.dayOfWeek === 0) ? ' sunday' : (j.dayOfWeek === 5 ? ' friday' : '');
                    html += `<div class="cell ${cls}${todayClass}${dayCls}">
                                <div class="date-num">${d}</div>
                                <div class="jawa-date">${j.jawaDay} ${j.bulanJawa}</div>
                                <div class="pasaran">${j.pasaran}</div>
                                <div class="wuku">${j.wuku}</div>
                                <div class="neptu ${getNeptuColorClass(j.neton)}">Neptu ${j.neptu} (${j.artiNeton})</div>
                            </div>`;
                }

                // Next month
                const total = firstDay + daysInMonth;
                const remaining = (7 - (total % 7)) % 7;
                for (let i = 1; i <= remaining; i++) {
                    const m = month === 11 ? 0 : month + 1;
                    const y = month === 11 ? year + 1 : year;
                    const j = getJawa(y, m, i);
                    const cls = getNetonClass(j.neton);
                    const dayCls = (j.dayOfWeek === 0) ? ' sunday' : (j.dayOfWeek === 5 ? ' friday' : '');
                    html += `<div class="cell other-month ${cls}${dayCls}">
                                <div class="date-num">${i}</div>
                                <div class="jawa-date">${j.jawaDay}</div>
                                <div class="pasaran">${j.pasaran}</div>
                                <div class="neptu ${getNeptuColorClass(j.neton)}">${j.neptu}</div>
                            </div>`;
                }

                grid.innerHTML = html;

                // Info hari ini
                const now = today;
                const jNow = getJawa(now.getFullYear(), now.getMonth(), now.getDate());
                infoJawaDate.textContent = `${jNow.jawaDay} ${jNow.bulanJawa} ${jNow.jawaYear}`;
                infoWeton.textContent = `${jNow.namaHari} ${jNow.pasaran}  (Neptu ${jNow.neptu})`;
                infoWuku.textContent = jNow.wuku;
                infoTahunJawa.textContent = `${jNow.jawaYear} AJ`;

                icsStatus.textContent = `${daysInMonth} hari • pilih rentang`;
            }

            function isToday(year, month, day) {
                return year === today.getFullYear() && month === today.getMonth() && day === today.getDate();
            }

            // ================== NAVIGASI ==================
            function goToMonth(year, month) {
                currentYear = year;
                currentMonth = month;
                renderCalendar(year, month);
            }

            function goToToday() {
                goToMonth(today.getFullYear(), today.getMonth());
            }

            function prevMonth() {
                let m = currentMonth - 1, y = currentYear;
                if (m < 0) { m = 11; y--; }
                goToMonth(y, m);
            }

            function nextMonth() {
                let m = currentMonth + 1, y = currentYear;
                if (m > 11) { m = 0; y++; }
                goToMonth(y, m);
            }

            // ================== DROPDOWN EVENT ==================
            monthSelect.addEventListener('change', function() {
                const m = parseInt(this.value);
                const y = parseInt(yearSelect.value);
                goToMonth(y, m);
            });

            yearSelect.addEventListener('change', function() {
                const m = parseInt(monthSelect.value);
                const y = parseInt(this.value);
                goToMonth(y, m);
            });

            // ================== GENERATE .ICS ==================
            function generateICS(year, month, monthsCount) {
                const events = [];
                const endMonth = month + monthsCount;
                const endYear = year + Math.floor(endMonth / 12);
                const finalMonth = endMonth % 12;

                let y = year, m = month;
                while (y < endYear || (y === endYear && m < finalMonth)) {
                    const days = new Date(y, m + 1, 0).getDate();
                    for (let d = 1; d <= days; d++) {
                        const j = getJawa(y, m, d);
                        const dateStr = `${y}${String(m+1).padStart(2,'0')}${String(d).padStart(2,'0')}`;
                        const next = new Date(y, m, d + 1);
                        const nextStr = `${next.getFullYear()}${String(next.getMonth()+1).padStart(2,'0')}${String(next.getDate()).padStart(2,'0')}`;
                        const summary = `🌾 ${j.jawaDay} ${j.bulanJawa} ${j.jawaYear} • ${j.pasaran} (Wuku: ${j.wuku}, Neptu: ${j.neptu})`;
                        const desc = `Tanggal Jawa: ${j.jawaDay} ${j.bulanJawa} ${j.jawaYear}\nPasaran: ${j.pasaran}\nWuku: ${j.wuku}\nNeptu: ${j.neptu} (${j.artiNeton})`;
                        events.push({ date: dateStr, end: nextStr, summary, desc });
                    }
                    m++;
                    if (m >= 12) { m = 0; y++; }
                }

                let ics = 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Kalender Jawa//ID//\r\nCALSCALE:GREGORIAN\r\n';
                for (const ev of events) {
                    ics += 'BEGIN:VEVENT\r\n';
                    ics += `DTSTART;VALUE=DATE:${ev.date}\r\n`;
                    ics += `DTEND;VALUE=DATE:${ev.end}\r\n`;
                    ics += `SUMMARY:${ev.summary}\r\n`;
                    ics += `DESCRIPTION:${ev.desc.replace(/\n/g, '\\n')}\r\n`;
                    ics += 'TRANSP:TRANSPARENT\r\n';
                    ics += 'X-MICROSOFT-CDO-ALARM:0\r\n';
                    ics += 'END:VEVENT\r\n';
                }
                ics += 'END:VCALENDAR\r\n';
                return ics;
            }

            function getMonthsCount() {
                return parseInt(rangeSelect.value, 10);
            }

            function downloadICS() {
                const months = getMonthsCount();
                const content = generateICS(currentYear, currentMonth, months);
                const blob = new Blob([content], { type: 'text/calendar;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `Kalender_Jawa_${BULAN_MASEHI[currentMonth]}_${currentYear}.ics`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                setTimeout(() => URL.revokeObjectURL(url), 5000);
                showToast('✅ File .ics berhasil diunduh (tanpa notifikasi)', 'success');
            }

            function copyICSLink() {
                const months = getMonthsCount();
                const content = generateICS(currentYear, currentMonth, months);
                const blob = new Blob([content], { type: 'text/calendar;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(url).then(() => {
                        showToast('📋 Link sementara disalin (berlaku 10 detik)', 'info');
                        setTimeout(() => URL.revokeObjectURL(url), 10000);
                    }).catch(() => fallbackCopy(url));
                } else {
                    fallbackCopy(url);
                }
            }

            function fallbackCopy(url) {
                const ta = document.createElement('textarea');
                ta.value = url;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                showToast('📋 Link sementara disalin (berlaku 10 detik)', 'info');
                setTimeout(() => URL.revokeObjectURL(url), 10000);
            }

            function showToast(msg, type='info', duration=3000) {
                toast.textContent = msg;
                toast.className = 'toast ' + type + ' show';
                clearTimeout(toast._hideTimer);
                toast._hideTimer = setTimeout(() => toast.classList.remove('show'), duration);
            }

            // ================== INIT ==================
            renderCalendar(currentYear, currentMonth);

            btnToday.addEventListener('click', goToToday);
            prevMonthBtn.addEventListener('click', prevMonth);
            nextMonthBtn.addEventListener('click', nextMonth);
            btnDownloadICS.addEventListener('click', downloadICS);
            btnCopyICS.addEventListener('click', copyICSLink);

            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft') prevMonth();
                else if (e.key === 'ArrowRight') nextMonth();
                else if (e.key === 't' || e.key === 'T') goToToday();
            });

            showToast('✅ Kalender Jawa siap | Dropdown tahun/bulan tersedia', 'success', 4000);
        })();
    </script>
</body>
</html>
