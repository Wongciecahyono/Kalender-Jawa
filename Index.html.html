<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kalender Jawa - Weton & Pasaran</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #f2e8d5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 850px;
            width: 100%;
            background: #fffbf2;
            border-radius: 24px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.1);
            padding: 24px 20px 32px;
            border: 1px solid #dcc9b0;
        }
        h1 {
            text-align: center;
            font-size: 28px;
            color: #4a3520;
            letter-spacing: 2px;
            margin-bottom: 6px;
            font-weight: 600;
        }
        .subtitle {
            text-align: center;
            color: #7a5d42;
            font-size: 14px;
            margin-bottom: 20px;
            border-bottom: 2px dashed #dcc9b0;
            padding-bottom: 12px;
        }
        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }
        .nav .month-year {
            font-size: 22px;
            font-weight: 700;
            color: #3d2b1a;
            background: #f4ebd0;
            padding: 4px 20px;
            border-radius: 40px;
            border: 1px solid #d4b58c;
        }
        .nav button {
            background: #8b6b4c;
            border: none;
            color: white;
            font-size: 18px;
            padding: 6px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
            border: 1px solid #6b4f34;
        }
        .nav button:hover {
            background: #6b4f34;
            transform: scale(1.02);
        }
        .nav button#todayBtn {
            background: #b08968;
            font-size: 14px;
        }
        .nav button#todayBtn:hover {
            background: #8b6b4c;
        }

        .calendar {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            margin-top: 10px;
        }
        .day-header {
            font-weight: 700;
            text-align: center;
            font-size: 14px;
            color: #4a3520;
            background: #e5d5be;
            padding: 8px 0;
            border-radius: 12px;
            letter-spacing: 1px;
        }
        .cell {
            background: #fffdf7;
            border-radius: 14px;
            padding: 8px 4px;
            text-align: center;
            border: 1px solid #ede3d2;
            transition: 0.15s;
            min-height: 68px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .cell .date {
            font-size: 22px;
            font-weight: 700;
            color: #2b1d10;
            line-height: 1.2;
        }
        .cell .pasaran {
            font-size: 12px;
            font-weight: 600;
            color: #7a5d42;
            background: #f4ebd0;
            padding: 1px 8px;
            border-radius: 30px;
            margin-top: 2px;
            display: inline-block;
            letter-spacing: 0.5px;
        }
        .cell .weton {
            font-size: 11px;
            color: #4a3520;
            font-weight: 500;
            margin-top: 1px;
        }
        .cell.today {
            background: #d4b08c;
            border-color: #8b6b4c;
            box-shadow: 0 0 0 2px #6b4f34;
        }
        .cell.today .date {
            color: #fff;
        }
        .cell.today .pasaran {
            background: #fffbf2;
            color: #4a3520;
        }
        .cell.today .weton {
            color: #fff;
        }
        .cell.other-month {
            opacity: 0.35;
        }
        .cell.weekend {
            background: #fcf4e8;
        }

        .export-area {
            margin-top: 24px;
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .export-area button {
            background: #2d5a3a;
            border: none;
            color: white;
            font-size: 16px;
            font-weight: 600;
            padding: 10px 28px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid #1d402a;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .export-area button:hover {
            background: #1d402a;
            transform: scale(1.02);
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #a0846a;
            border-top: 1px solid #ede3d2;
            padding-top: 16px;
        }
        .footer a {
            color: #6b4f34;
            text-decoration: none;
            font-weight: 600;
        }

        @media (max-width: 500px) {
            .container {
                padding: 12px 8px;
            }
            .cell {
                min-height: 56px;
                padding: 4px 2px;
            }
            .cell .date {
                font-size: 17px;
            }
            .cell .pasaran {
                font-size: 9px;
                padding: 0 5px;
            }
            .nav .month-year {
                font-size: 17px;
                padding: 2px 14px;
            }
            .nav button {
                font-size: 14px;
                padding: 4px 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📅 Kalender Jawa</h1>
        <div class="subtitle">Weton &bull; Pasaran &bull; Masehi</div>

        <!-- Navigation -->
        <div class="nav">
            <button id="prevBtn">◀</button>
            <span class="month-year" id="monthYear">Agustus 2026</span>
            <button id="nextBtn">▶</button>
            <button id="todayBtn">● Hari Ini</button>
        </div>

        <!-- Calendar Grid -->
        <div class="calendar" id="calendarGrid">
            <!-- diisi oleh JS -->
        </div>

        <!-- Export -->
        <div class="export-area">
            <button id="exportIcs">📤 Ekspor .ICS (Kalender)</button>
        </div>

        <div class="footer">
            ⚡ Berbasis patokan <strong>1 Januari 2000 = Sabtu Legi</strong> (sesuai sumber ICS Anda) &bull;
            <span style="color:#b35f2b;">✓ 2 Agt = Minggu Legi, 9 Agt = Minggu Pon, 16 Agt = Minggu Kliwon, 30 Agt = Minggu Wage</span>
        </div>
    </div>

    <script>
        // ----- KONSTANTA & PATOKAN (SESUAI SUMBER ICS ANDA) -----
        const PASARAN = ['Legi', 'Pahing', 'Pon', 'Wage', 'Kliwon'];
        const NAMA_HARI = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
        // Patokan: 1 Januari 2000 = Sabtu Legi (index pasaran 0)
        const BASE_DATE = new Date(Date.UTC(2000, 0, 1));

        // ----- FUNGSI INTI (PERBAIKAN: tanpa +1) -----
        function getJawaInfo(year, month, day) {
            const target = new Date(Date.UTC(year, month, day));
            const diffMs = target.getTime() - BASE_DATE.getTime();
            const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));

            // Karena 1 Jan 2000 = Legi (index 0), cukup diffDays % 5
            const pasaranIdx = ((diffDays % 5) + 5) % 5; // amankan dari negatif
            const hariIdx = target.getUTCDay();    // 0=Minggu, 1=Senin, ...

            return {
                hari: NAMA_HARI[hariIdx],
                pasaran: PASARAN[pasaranIdx],
                weton: NAMA_HARI[hariIdx] + ' ' + PASARAN[pasaranIdx]
            };
        }

        // ----- RENDER KALENDER -----
        function renderCalendar(year, month) {
            const grid = document.getElementById('calendarGrid');
            const title = document.getElementById('monthYear');
            const months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
                'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'
            ];
            title.textContent = months[month] + ' ' + year;

            const firstDay = new Date(Date.UTC(year, month, 1)).getUTCDay();
            const daysInMonth = new Date(Date.UTC(year, month + 1, 0)).getUTCDate();
            const daysInPrevMonth = new Date(Date.UTC(year, month, 0)).getUTCDate();

            let startOffset = (firstDay === 0) ? 6 : firstDay - 1;

            let html = '';
            const headerHari = ['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'];
            headerHari.forEach(h => {
                html += `<div class="day-header">${h}</div>`;
            });

            const today = new Date();
            const todayUTC = new Date(Date.UTC(today.getFullYear(), today.getMonth(), today.getDate()));

            for (let i = 0; i < startOffset; i++) {
                const prevDate = daysInPrevMonth - startOffset + i + 1;
                html += `<div class="cell other-month"><div class="date">${prevDate}</div></div>`;
            }

            for (let d = 1; d <= daysInMonth; d++) {
                const info = getJawaInfo(year, month, d);
                const currentDate = new Date(Date.UTC(year, month, d));
                const isToday = currentDate.getTime() === todayUTC.getTime();
                const dayIdx = currentDate.getUTCDay();
                const isWeekend = (dayIdx === 5 || dayIdx === 6);

                let classes = 'cell';
                if (isToday) classes += ' today';
                if (isWeekend) classes += ' weekend';

                html += `
                    <div class="${classes}">
                        <div class="date">${d}</div>
                        <span class="pasaran">${info.pasaran}</span>
                        <div class="weton">${info.hari}</div>
                    </div>
                `;
            }

            const totalCells = startOffset + daysInMonth;
            const remaining = (7 - (totalCells % 7)) % 7;
            for (let i = 1; i <= remaining; i++) {
                html += `<div class="cell other-month"><div class="date">${i}</div></div>`;
            }

            grid.innerHTML = html;
        }

        // ----- EKSPOR ICS (juga ikut patokan baru) -----
        function generateICS(year, month) {
            const daysInMonth = new Date(Date.UTC(year, month + 1, 0)).getUTCDate();
            let ics = [];
            ics.push('BEGIN:VCALENDAR');
            ics.push('VERSION:2.0');
            ics.push('PRODID:-//Kalender Jawa//v1.0//ID');
            ics.push('CALSCALE:GREGORIAN');

            for (let d = 1; d <= daysInMonth; d++) {
                const info = getJawaInfo(year, month, d);
                const y = year;
                const m = String(month + 1).padStart(2, '0');
                const day = String(d).padStart(2, '0');
                const dateStr = `${y}${m}${day}`;

                ics.push('BEGIN:VEVENT');
                ics.push(`DTSTART;VALUE=DATE:${dateStr}`);
                ics.push(`DTEND;VALUE=DATE:${dateStr}`);
                ics.push(`SUMMARY:${info.weton}`);
                ics.push(`DESCRIPTION:Tanggal ${d} ${['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'][month]} ${year} - ${info.weton}`);
                ics.push('END:VEVENT');
            }

            ics.push('END:VCALENDAR');
            return ics.join('\r\n');
        }

        function downloadICS(year, month) {
            const content = generateICS(year, month);
            const blob = new Blob([content], { type: 'text/calendar;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            const months = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
            a.download = `kalender-jawa-${months[month]}-${year}.ics`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // ----- NAVIGASI -----
        let currentYear = 2026;
        let currentMonth = 7;

        function updateCalendar() {
            renderCalendar(currentYear, currentMonth);
        }

        document.getElementById('prevBtn').addEventListener('click', () => {
            currentMonth--;
            if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            updateCalendar();
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            currentMonth++;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            }
            updateCalendar();
        });

        document.getElementById('todayBtn').addEventListener('click', () => {
            const today = new Date();
            currentYear = today.getFullYear();
            currentMonth = today.getMonth();
            updateCalendar();
        });

        document.getElementById('exportIcs').addEventListener('click', () => {
            downloadICS(currentYear, currentMonth);
        });

        // ----- MULAI TAMPILKAN AGUSTUS 2026 -----
        renderCalendar(2026, 7);

        // Verifikasi otomatis di konsol
        console.log('🔍 Test 2 Agustus 2026:', getJawaInfo(2026, 7, 2).weton); // Minggu Legi
        console.log('🔍 Test 9 Agustus 2026:', getJawaInfo(2026, 7, 9).weton); // Minggu Pon
        console.log('🔍 Test 16 Agustus 2026:', getJawaInfo(2026, 7, 16).weton); // Minggu Kliwon
        console.log('🔍 Test 30 Agustus 2026:', getJawaInfo(2026, 7, 30).weton); // Minggu Wage
    </script>
</body>
</html>
